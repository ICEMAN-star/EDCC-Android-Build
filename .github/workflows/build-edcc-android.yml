
name: Build Hadir EDCC for Android

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-edcc-android.yml'
      - 'jni/**'
      - 'EDCC-Palmprint-Recognition-master (1).zip'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 3. Install Android NDK and CMake
      - name: Install Android NDK and CMake
        run: |
          set -e

          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

          test -f "$SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"

      # 4. Download and extract EDCC and OpenCV
      - name: Download and Extract source archives
        run: |
          set -e

          mkdir -p work/edcc work/opencv

          echo "Checking EDCC archive..."

          unzip -t "EDCC-Palmprint-Recognition-master (1).zip"

          echo "Downloading OpenCV Mobile 3.4.20..."

          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/nihui/opencv-mobile/releases/latest/download/opencv-mobile-3.4.20-android.zip" \
            -o opencv-mobile-3.4.20-android.zip

          echo "Checking OpenCV archive..."

          unzip -t opencv-mobile-3.4.20-android.zip

          echo "Extracting EDCC..."

          unzip -q "EDCC-Palmprint-Recognition-master (1).zip" -d work/edcc

          echo "Extracting OpenCV..."

          unzip -q opencv-mobile-3.4.20-android.zip -d work/opencv

      # 5. Locate EDCC and OpenCV
      - name: Locate source and OpenCV
        run: |
          set -e

          EDCC_CONFIG=$(find "$GITHUB_WORKSPACE/work/edcc" \
            -name CMakeLists.txt -print -quit)

          test -n "$EDCC_CONFIG"

          EDCC_ROOT=$(dirname "$EDCC_CONFIG")
          EDCC_ROOT=$(realpath "$EDCC_ROOT")

          OPENCV_CONFIG=$(find "$GITHUB_WORKSPACE/work/opencv" \
            -path '*/sdk/native/jni/abi-arm64-v8a/OpenCVConfig.cmake' \
            -print -quit)

          if [ -z "$OPENCV_CONFIG" ]; then
            OPENCV_CONFIG=$(find "$GITHUB_WORKSPACE/work/opencv" \
              -path '*/jni/abi-arm64-v8a/OpenCVConfig.cmake' \
              -print -quit)
          fi

          if [ -z "$OPENCV_CONFIG" ]; then
            echo "ERROR: ARM64 OpenCV configuration not found."
            find "$GITHUB_WORKSPACE/work/opencv" \
              -name OpenCVConfig.cmake -print
            exit 1
          fi

          OPENCV_DIR=$(dirname "$OPENCV_CONFIG")
          OPENCV_DIR=$(realpath "$OPENCV_DIR")

          test -f "$OPENCV_DIR/OpenCVConfig.cmake"

          echo "EDCC_ROOT=$EDCC_ROOT" >> "$GITHUB_ENV"
          echo "OpenCV_DIR=$OPENCV_DIR" >> "$GITHUB_ENV"

          echo "EDCC source: $EDCC_ROOT"
          echo "OpenCV config: $OPENCV_DIR"

      # 6. Configure EDCC static library
      - name: Configure EDCC
        run: |
          set -e

          cmake -S "$EDCC_ROOT" \
            -B "$GITHUB_WORKSPACE/build-edcc" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DOpenCV_DIR="$OpenCV_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DEDCC_BUILD_SHARED_LIBS=OFF \
            -DEDCC_BUILD_TESTS=OFF \
            -DEDCC_BUILD_DEV=OFF

      # 7. Build EDCC static library
      - name: Build EDCC
        run: |
          set -e

          cmake --build "$GITHUB_WORKSPACE/build-edcc" \
            --config Release --parallel 2

      # 8. Locate EDCC library
      - name: Locate EDCC library
        run: |
          set -e

          EDCC_LIBRARY=$(find "$GITHUB_WORKSPACE/build-edcc" \
            -name 'libedcc.a' -print -quit)

          if [ -z "$EDCC_LIBRARY" ]; then
            echo "ERROR: libedcc.a was not generated."
            exit 1
          fi

          EDCC_LIBRARY=$(realpath "$EDCC_LIBRARY")

          echo "EDCC_LIBRARY=$EDCC_LIBRARY" >> "$GITHUB_ENV"

          echo "EDCC library: $EDCC_LIBRARY"

      # 9. Configure JNI shared library
      - name: Configure Hadir JNI
        run: |
          set -e

          test -f "$GITHUB_WORKSPACE/jni/CMakeLists.txt"
          test -f "$GITHUB_WORKSPACE/jni/hadir_edcc_jni.cpp"
          test -f "$EDCC_LIBRARY"

          cmake -S "$GITHUB_WORKSPACE/jni" \
            -B "$GITHUB_WORKSPACE/build-jni" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DOpenCV_DIR="$OpenCV_DIR" \
            -DEDCC_ROOT="$EDCC_ROOT" \
            -DEDCC_LIBRARY="$EDCC_LIBRARY" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON

      # 10. Build JNI shared library
      - name: Build Hadir JNI
        run: |
          set -e

          cmake --build "$GITHUB_WORKSPACE/build-jni" \
            --config Release --parallel 2

      # 11. Verify and prepare output
      - name: Verify and Package Libraries
        run: |
          set -e

          JNI_LIBRARY=$(find "$GITHUB_WORKSPACE/build-jni" \
            -name 'libhadir_edcc.so' -print -quit)

          if [ -z "$JNI_LIBRARY" ]; then
            echo "ERROR: libhadir_edcc.so was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist/arm64-v8a"
          mkdir -p "$GITHUB_WORKSPACE/dist/include"

          cp "$JNI_LIBRARY" \
            "$GITHUB_WORKSPACE/dist/arm64-v8a/"

          cp "$EDCC_LIBRARY" \
            "$GITHUB_WORKSPACE/dist/arm64-v8a/"

          cp -R "$EDCC_ROOT/include/edcc" \
            "$GITHUB_WORKSPACE/dist/include/"

          echo "Generated files:"
          find "$GITHUB_WORKSPACE/dist" -type f -print

          echo "SUCCESS: Hadir EDCC JNI library generated."

      # 12. Upload final Android artifact
      - name: Upload Hadir EDCC Android
        uses: actions/upload-artifact@v4
        with:
          name: Hadir-EDCC-Android-arm64-v8a
          path: dist/
          if-no-files-found: error
